<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Χρήστες - Ζαχαροπλαστείο Ζάχαρη</title>
    <link rel="stylesheet" href="modern-style.css">
</head>
<body>
    <div class="top-header">
        <div class="header-content">
            <div style="width: 100px;"></div>
            <div class="logo-container">
                <a href="dashboard.html" class="logo-link">
                    <img src="banner.png" alt="Ζάχαρη" class="logo-nav">
                </a>
            </div>
            <div class="user-menu-top" id="userMenuTop"></div>
        </div>
    </div>

    <nav id="navbar" class="navbar"></nav>
    <div class="mobile-user-icon" id="mobileUserIcon">👤</div>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">👤 Διαχείριση Χρηστών</h2>
                <button onclick="showAddUserModal()" class="btn btn-primary">➕ Νέος Χρήστης</button>
            </div>
            <div class="card-body">
                <div class="table-wrapper">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Username</th>
                                <th>Ονοματεπώνυμο</th>
                                <th>Email</th>
                                <th>Ρόλος</th>
                                <th>Ενεργός</th>
                                <th>Ενέργειες</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav" id="bottomNav"></nav>
    <a href="order-form.html" class="fab">+</a>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="v3-app.js"></script>
    <script>
        Auth.requireAuth();
        Auth.requireAdmin();

        let allUsers = [];

        async function loadUsers() {
            showLoading();

            try {
                const { data, error } = await _supabase
                    .from('users')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                allUsers = data || [];
                displayUsers();

            } catch (err) {
                showToast('Σφάλμα φόρτωσης: ' + err.message, 'error');
            }

            hideLoading();
        }

        function displayUsers() {
            const tbody = document.getElementById('usersTableBody');

            if (allUsers.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color: #6c757d; padding: 30px;">Δεν υπάρχουν χρήστες</td></tr>';
                return;
            }

            tbody.innerHTML = allUsers.map(user => {
                const roleBadge = user.role === 'admin' 
                    ? '<span class="badge badge-danger">Admin</span>' 
                    : '<span class="badge badge-info">User</span>';
                
                const activeBadge = user.is_active 
                    ? '<span class="badge badge-success">✓ Ενεργός</span>' 
                    : '<span class="badge badge-secondary">✗ Ανενεργός</span>';

                return '<tr>' +
                    '<td><strong>' + user.username + '</strong></td>' +
                    '<td>' + user.full_name + '</td>' +
                    '<td>' + user.email + '</td>' +
                    '<td>' + roleBadge + '</td>' +
                    '<td>' + activeBadge + '</td>' +
                    '<td>' +
                        '<div style="display: flex; gap: 6px;">' +
                            '<button onclick="editUser(\'' + user.id + '\')" class="btn btn-sm btn-secondary">📝</button>' +
                            '<button onclick="toggleUserStatus(\'' + user.id + '\')" class="btn btn-sm btn-warning">' + (user.is_active ? '🔒' : '🔓') + '</button>' +
                            '<button onclick="deleteUser(\'' + user.id + '\')" class="btn btn-sm btn-danger">🗑️</button>' +
                        '</div>' +
                    '</td>' +
                '</tr>';
            }).join('');
        }

        function showAddUserModal() {
            const modalContent = '<form id="addUserForm" onsubmit="addUser(event)">' +
                '<div class="form-group"><label class="form-label">Username *</label>' +
                '<input type="text" id="newUsername" class="form-control" required placeholder="Μοναδικό username"></div>' +
                '<div class="form-group"><label class="form-label">Ονοματεπώνυμο *</label>' +
                '<input type="text" id="newFullName" class="form-control" required></div>' +
                '<div class="form-group"><label class="form-label">Email *</label>' +
                '<input type="email" id="newEmail" class="form-control" required></div>' +
                '<div class="form-group"><label class="form-label">Κωδικός *</label>' +
                '<input type="password" id="newPassword" class="form-control" required minlength="6"></div>' +
                '<div class="form-group"><label class="form-label">Ρόλος</label>' +
                '<select id="newRole" class="form-control">' +
                    '<option value="user">User</option>' +
                    '<option value="admin">Admin</option>' +
                '</select></div>' +
                '</form>';

            showModal('➕ Νέος Χρήστης', modalContent, [
                { text: 'Ακύρωση', class: 'btn-secondary' },
                { text: 'Δημιουργία', class: 'btn-primary', onClick: () => { document.getElementById('addUserForm').requestSubmit(); }}
            ]);
        }

        async function addUser(e) {
            e.preventDefault();
            showLoading();

            const userData = {
                username: document.getElementById('newUsername').value.trim(),
                full_name: document.getElementById('newFullName').value.trim(),
                email: document.getElementById('newEmail').value.trim(),
                password_hash: document.getElementById('newPassword').value,
                role: document.getElementById('newRole').value,
                is_active: true,
                created_at: new Date().toISOString()
            };

            try {
                const { data, error } = await _supabase.from('users').insert([userData]).select();
                if (error) throw error;

                await Auth.logActivity('create', 'user', data[0].id, { username: userData.username });
                showToast('Ο χρήστης δημιουργήθηκε!', 'success');
                loadUsers();

            } catch (err) {
                if (err.message.includes('duplicate') || err.message.includes('unique')) {
                    showToast('Το username ή email υπάρχει ήδη', 'error');
                } else {
                    showToast('Σφάλμα: ' + err.message, 'error');
                }
            }

            hideLoading();
        }

        function editUser(userId) {
            const user = allUsers.find(u => u.id === userId);
            if (!user) return;

            const modalContent = '<form id="editUserForm" onsubmit="saveUser(event, \'' + userId + '\')">' +
                '<div class="form-group"><label class="form-label">Username *</label>' +
                '<input type="text" id="editUsername" class="form-control" value="' + user.username + '" required></div>' +
                '<div class="form-group"><label class="form-label">Ονοματεπώνυμο *</label>' +
                '<input type="text" id="editFullName" class="form-control" value="' + user.full_name + '" required></div>' +
                '<div class="form-group"><label class="form-label">Email *</label>' +
                '<input type="email" id="editEmail" class="form-control" value="' + user.email + '" required></div>' +
                '<div class="form-group"><label class="form-label">Νέος Κωδικός (προαιρετικά)</label>' +
                '<input type="password" id="editPassword" class="form-control" placeholder="Αφήστε κενό για να μην αλλάξει"></div>' +
                '<div class="form-group"><label class="form-label">Ρόλος</label>' +
                '<select id="editRole" class="form-control">' +
                    '<option value="user" ' + (user.role === 'user' ? 'selected' : '') + '>User</option>' +
                    '<option value="admin" ' + (user.role === 'admin' ? 'selected' : '') + '>Admin</option>' +
                '</select></div>' +
                '</form>';

            showModal('📝 Επεξεργασία Χρήστη', modalContent, [
                { text: 'Ακύρωση', class: 'btn-secondary' },
                { text: 'Αποθήκευση', class: 'btn-primary', onClick: () => { document.getElementById('editUserForm').requestSubmit(); }}
            ]);
        }

        async function saveUser(e, userId) {
            e.preventDefault();
            showLoading();

            const userData = {
                username: document.getElementById('editUsername').value.trim(),
                full_name: document.getElementById('editFullName').value.trim(),
                email: document.getElementById('editEmail').value.trim(),
                role: document.getElementById('editRole').value,
                updated_at: new Date().toISOString()
            };

            const newPassword = document.getElementById('editPassword').value;
            if (newPassword) {
                userData.password_hash = newPassword;
            }

            try {
                const { error } = await _supabase.from('users').update(userData).eq('id', userId);
                if (error) throw error;

                await Auth.logActivity('update', 'user', userId, { username: userData.username });
                showToast('Ο χρήστης ενημερώθηκε!', 'success');
                loadUsers();

            } catch (err) {
                showToast('Σφάλμα: ' + err.message, 'error');
            }

            hideLoading();
        }

        async function toggleUserStatus(userId) {
            const user = allUsers.find(u => u.id === userId);
            if (!user) return;

            const currentUser = Auth.getCurrentUser();
            if (currentUser.id === userId) {
                showToast('Δεν μπορείτε να απενεργοποιήσετε τον εαυτό σας!', 'warning');
                return;
            }

            showLoading();

            try {
                const { error } = await _supabase
                    .from('users')
                    .update({ is_active: !user.is_active })
                    .eq('id', userId);

                if (error) throw error;

                await Auth.logActivity('update', 'user', userId, { 
                    action: user.is_active ? 'deactivated' : 'activated' 
                });

                showToast(user.is_active ? 'Ο χρήστης απενεργοποιήθηκε' : 'Ο χρήστης ενεργοποιήθηκε', 'success');
                loadUsers();

            } catch (err) {
                showToast('Σφάλμα: ' + err.message, 'error');
            }

            hideLoading();
        }

        async function deleteUser(userId) {
            const user = allUsers.find(u => u.id === userId);
            if (!user) return;

            const currentUser = Auth.getCurrentUser();
            if (currentUser.id === userId) {
                showToast('Δεν μπορείτε να διαγράψετε τον εαυτό σας!', 'warning');
                return;
            }

            confirmDialog(
                'Διαγραφή χρήστη: ' + user.full_name + ' (' + user.username + ');',
                async () => {
                    showLoading();

                    try {
                        const { error } = await _supabase.from('users').delete().eq('id', userId);
                        if (error) throw error;

                        await Auth.logActivity('delete', 'user', userId, { username: user.username });
                        showToast('Ο χρήστης διαγράφηκε', 'success');
                        loadUsers();

                    } catch (err) {
                        showToast('Σφάλμα: ' + err.message, 'error');
                    }

                    hideLoading();
                }
            );
        }

        window.onload = loadUsers;
    </script>
</body>
</html>
