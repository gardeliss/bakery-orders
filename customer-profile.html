<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Προφίλ Πελάτη - Ζαχαροπλαστείο Ζάχαρη</title>
    <link rel="stylesheet" href="modern-style.css">
</head>
<body>
    <div class="top-header">
        <div class="header-content">
            <div style="width: 100px;"></div>
            <div class="logo-container">
                <a href="dashboard.html" class="logo-link">
                    <img src="banner.png" alt="Ζάχαρη" class="logo-nav">
                </a>
            </div>
            <div class="user-menu-top" id="userMenuTop"></div>
        </div>
    </div>

    <nav id="navbar" class="navbar"></nav>
    <div class="mobile-user-icon" id="mobileUserIcon">👤</div>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <h2 class="card-title" id="customerName">👤 Προφίλ</h2>
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <button onclick="editCustomerInfo()" class="btn btn-secondary">📝</button>
                    <a href="customers.html" class="btn btn-outline">← Πίσω</a>
                </div>
            </div>
            <div class="card-body">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Όνομα</label>
                        <p id="customerFullName" style="font-size: 1.1rem; font-weight: 600;">-</p>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Τηλέφωνο</label>
                        <p id="customerPhone" style="font-size: 1.1rem;">-</p>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <p id="customerEmail" style="font-size: 1.1rem;">-</p>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Διεύθυνση</label>
                        <p id="customerAddress" style="font-size: 1.1rem;">-</p>
                    </div>
                </div>
                <div class="form-group" id="notesSection" style="display: none;">
                    <label class="form-label">Σημειώσεις</label>
                    <p id="customerNotes" style="background: #f9f9f9; padding: 10px; border-radius: 8px;">-</p>
                </div>
            </div>
        </div>

        <!-- Statistics -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">📦</div>
                <div class="stat-value" id="totalOrders">0</div>
                <div class="stat-label">Παραγγελίες</div>
            </div>
            <div class="stat-card" style="background: linear-gradient(135deg, #28a745 0%, #218838 100%);">
                <div class="stat-icon">💰</div>
                <div class="stat-value" id="totalSpent">0€</div>
                <div class="stat-label">Σύνολο</div>
            </div>
            <div class="stat-card" style="background: linear-gradient(135deg, #17a2b8 0%, #138496 100%);">
                <div class="stat-icon">📊</div>
                <div class="stat-value" id="avgOrderValue">0€</div>
                <div class="stat-label">Μέση Αξία</div>
            </div>
            <div class="stat-card" style="background: linear-gradient(135deg, #ffc107 0%, #e0a800 100%);">
                <div class="stat-icon">📅</div>
                <div class="stat-value" id="lastOrderDate">-</div>
                <div class="stat-label">Τελευταία</div>
            </div>
        </div>

        <!-- Order History -->
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">📋 Ιστορικό</h2>
                <button onclick="printCustomerReport()" class="btn btn-primary">🖨️ Αναφορά</button>
            </div>
            <div class="card-body" id="orderHistory"></div>
        </div>
    </div>

    <nav class="bottom-nav" id="bottomNav"></nav>
    <a href="order-form.html" class="fab">+</a>

    <div id="printArea"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
    <script>
        Auth.requireAuth();

        let currentCustomer = null;
        let customerOrders = [];

        async function loadCustomerProfile() {
            const params = new URLSearchParams(window.location.search);
            const customerId = params.get('id');

            if (!customerId) {
                showToast('Δεν βρέθηκε πελάτης', 'error');
                setTimeout(() => window.location.href = 'customers.html', 1000);
                return;
            }

            showLoading();

            try {
                const { data: customer, error: customerError } = await _supabase.from('customers').select('*').eq('id', customerId).single();
                if (customerError) throw customerError;
                currentCustomer = customer;

                const { data: orders, error: ordersError } = await _supabase.from('orders').select('*').eq('phone', customer.phone).order('delivery_date', { ascending: false });
                if (ordersError) throw ordersError;
                customerOrders = orders || [];

                displayCustomerInfo();
                displayStatistics();
                displayOrderHistory();

            } catch (err) {
                showToast('Σφάλμα: ' + err.message, 'error');
            }

            hideLoading();
        }

        function displayCustomerInfo() {
            document.getElementById('customerName').textContent = '👤 ' + currentCustomer.last_name + ' ' + currentCustomer.first_name;
            document.getElementById('customerFullName').textContent = currentCustomer.last_name + ' ' + currentCustomer.first_name;
            document.getElementById('customerPhone').textContent = currentCustomer.phone;
            document.getElementById('customerEmail').textContent = currentCustomer.email || '-';
            document.getElementById('customerAddress').textContent = currentCustomer.address || '-';
            
            if (currentCustomer.notes) {
                document.getElementById('customerNotes').textContent = currentCustomer.notes;
                document.getElementById('notesSection').style.display = 'block';
            }
        }

        function displayStatistics() {
            const totalOrders = customerOrders.length;
            const totalSpent = customerOrders.reduce((sum, o) => sum + (parseFloat(o.total_price) || 0), 0);
            const avgOrderValue = totalOrders > 0 ? totalSpent / totalOrders : 0;
            const lastOrder = customerOrders.length > 0 ? customerOrders[0].delivery_date : null;

            document.getElementById('totalOrders').textContent = totalOrders;
            document.getElementById('totalSpent').textContent = formatCurrency(totalSpent);
            document.getElementById('avgOrderValue').textContent = formatCurrency(avgOrderValue);
            document.getElementById('lastOrderDate').textContent = lastOrder ? formatDate(lastOrder) : '-';
        }

        function displayOrderHistory() {
            const container = document.getElementById('orderHistory');

            if (customerOrders.length === 0) {
                container.innerHTML = '<p style="text-align:center; color: #6c757d; padding: 30px;">Δεν υπάρχουν παραγγελίες</p>';
                return;
            }

            container.innerHTML = '';

            customerOrders.forEach(order => {
                const orderCard = document.createElement('div');
                orderCard.className = 'order-card';
                orderCard.innerHTML = 
                    '<div class="order-header">' +
                        '<div>' +
                            '<div class="order-date">📅 ' + formatDate(order.delivery_date) + ' (' + getGreekDayName(order.delivery_date) + ')</div>' +
                            '<div style="font-size: 0.9rem; color: #6c757d; margin-top: 5px;">📍 ' + order.location_type + (order.address ? ' - ' + order.address : '') + '</div>' +
                        '</div>' +
                        '<span class="badge badge-' + order.status + '">' + getStatusText(order.status) + '</span>' +
                    '</div>' +
                    '<div class="order-description">' + order.description + '</div>' +
                    '<div class="order-footer">' +
                        '<div>' +
                            '<div class="order-price">' + formatCurrency(order.total_price) + '</div>' +
                            '<small style="color: #6c757d;">Υπόλοιπο: ' + formatCurrency(order.total_price - order.deposit) + '</small>' +
                        '</div>' +
                        '<div class="order-actions"></div>' +
                    '</div>';

                const editBtn = document.createElement('a');
                editBtn.href = 'order-form.html?edit=' + order.id;
                editBtn.className = 'btn btn-sm btn-secondary';
                editBtn.textContent = '📝';

                const printBtn = document.createElement('button');
                printBtn.className = 'btn btn-sm btn-outline';
                printBtn.textContent = '🖨️';
                printBtn.addEventListener('click', function() {
                    printOrder(order.id);
                });

                const actionsDiv = orderCard.querySelector('.order-actions');
                actionsDiv.appendChild(editBtn);
                actionsDiv.appendChild(printBtn);

                container.appendChild(orderCard);
            });
        }

        function getStatusText(status) {
            const statuses = {'pending': 'Εκκρεμεί', 'confirmed': 'Επιβεβαιωμένη', 'completed': 'Ολοκληρωμένη', 'cancelled': 'Ακυρωμένη'};
            return statuses[status] || status;
        }

        function editCustomerInfo() {
            const modalContent = '<form id="editCustomerForm" onsubmit="saveCustomerInfo(event)">' +
                '<div class="form-row"><div class="form-group"><label class="form-label">Όνομα</label>' +
                '<input type="text" id="editFirstName" class="form-control" value="' + currentCustomer.first_name + '" required></div>' +
                '<div class="form-group"><label class="form-label">Επώνυμο</label>' +
                '<input type="text" id="editLastName" class="form-control" value="' + currentCustomer.last_name + '" required></div></div>' +
                '<div class="form-row"><div class="form-group"><label class="form-label">Τηλέφωνο</label>' +
                '<input type="tel" id="editPhone" class="form-control" value="' + currentCustomer.phone + '" required></div>' +
                '<div class="form-group"><label class="form-label">Email</label>' +
                '<input type="email" id="editEmail" class="form-control" value="' + (currentCustomer.email || '') + '"></div></div>' +
                '<div class="form-group"><label class="form-label">Διεύθυνση</label>' +
                '<input type="text" id="editAddress" class="form-control" value="' + (currentCustomer.address || '') + '"></div>' +
                '<div class="form-group"><label class="form-label">Σημειώσεις</label>' +
                '<textarea id="editNotes" class="form-control" rows="3">' + (currentCustomer.notes || '') + '</textarea></div></form>';

            showModal('📝 Επεξεργασία', modalContent, [
                {text: 'Ακύρωση', class: 'btn-secondary'},
                {text: 'Αποθήκευση', class: 'btn-primary', onClick: () => { document.getElementById('editCustomerForm').requestSubmit(); }}
            ]);
        }

        async function saveCustomerInfo(e) {
            e.preventDefault();
            showLoading();

            const customerData = {
                first_name: document.getElementById('editFirstName').value.trim(),
                last_name: document.getElementById('editLastName').value.trim(),
                phone: document.getElementById('editPhone').value.trim(),
                email: document.getElementById('editEmail').value.trim() || null,
                address: document.getElementById('editAddress').value.trim() || null,
                notes: document.getElementById('editNotes').value.trim() || null,
                updated_at: new Date().toISOString()
            };

            try {
                const { error } = await _supabase.from('customers').update(customerData).eq('id', currentCustomer.id);
                if (error) throw error;
                await Auth.logActivity('update', 'customer', currentCustomer.id, { customer: customerData });
                showToast('Ενημερώθηκε!', 'success');
                loadCustomerProfile();
            } catch (err) {
                showToast('Σφάλμα: ' + err.message, 'error');
            }

            hideLoading();
        }

        function printOrder(orderId) {
            const order = customerOrders.find(o => o.id === orderId);
            if (!order) return;

            let html = '<h2 style="text-align:center; border-bottom:2px solid #2a5a5a; padding-bottom: 10px;">ΑΠΟΔΕΙΞΗ ΠΑΡΑΓΓΕΛΙΑΣ</h2>' +
                '<p><strong>Πελάτης:</strong> ' + order.last_name + ' ' + order.first_name + '</p>' +
                '<p><strong>Τηλέφωνο:</strong> ' + order.phone + '</p>' +
                '<p><strong>Ημερομηνία:</strong> ' + formatDate(order.delivery_date) + ' (' + getGreekDayName(order.delivery_date) + ')</p>' +
                '<p><strong>Τοποθεσία:</strong> ' + order.location_type + '</p>' +
                (order.address ? '<p><strong>Διεύθυνση:</strong> ' + order.address + '</p>' : '') +
                '<div style="border:1px solid #ccc; padding:15px; margin:20px 0; background: #f9f9f9;"><strong>ΠΕΡΙΓΡΑΦΗ:</strong><br><br>' +
                order.description.replace(/\n/g, '<br>') + '</div>' +
                '<div style="text-align:right; margin-top: 30px;">' +
                '<p style="font-size: 1.1rem;"><strong>Σύνολο:</strong> ' + formatCurrency(order.total_price) + '</p>' +
                '<p style="font-size: 1.1rem;"><strong>Προκαταβολή:</strong> ' + formatCurrency(order.deposit) + '</p>' +
                '<h2 style="color:#2a5a5a; border-top: 2px solid #2a5a5a; padding-top: 10px;">Υπόλοιπο: ' + formatCurrency(order.total_price - order.deposit) + '</h2></div>' +
                '<div style="margin-top: 50px; text-align: center; font-size: 0.9rem; color: #666;"><p>Σας ευχαριστούμε!</p><p>Ζαχαροπλαστείο ΖΑΧΑΡΗ</p></div>';

            renderAndPrint(html);
            Auth.logActivity('print', 'order', orderId, { type: 'single_order' });
        }

        function printCustomerReport() {
            if (!currentCustomer || customerOrders.length === 0) {
                showToast('Δεν υπάρχουν δεδομένα', 'warning');
                return;
            }

            const totalSpent = customerOrders.reduce((sum, o) => sum + (parseFloat(o.total_price) || 0), 0);
            const totalDeposits = customerOrders.reduce((sum, o) => sum + (parseFloat(o.deposit) || 0), 0);
            const totalRemaining = totalSpent - totalDeposits;

            let html = '<h2 style="text-align:center; color:#2a5a5a; border-bottom:2px solid #2a5a5a; padding-bottom:10px;">📊 Αναφορά Πελάτη</h2>' +
                '<div style="margin: 20px 0; padding: 20px; background: #f9f9f9; border-radius: 8px;">' +
                '<h3 style="color:#2a5a5a; margin-top: 0;">' + currentCustomer.last_name + ' ' + currentCustomer.first_name + '</h3>' +
                '<p style="margin: 5px 0;"><strong>Τηλέφωνο:</strong> ' + currentCustomer.phone + '</p>' +
                (currentCustomer.email ? '<p style="margin: 5px 0;"><strong>Email:</strong> ' + currentCustomer.email + '</p>' : '') +
                '</div><div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin: 20px 0;">' +
                '<div style="background: #e8f5e9; padding: 15px; border-radius: 8px; text-align: center;"><div style="font-size: 2rem; font-weight: bold;">' + customerOrders.length + '</div><div>Παραγγελίες</div></div>' +
                '<div style="background: #e3f2fd; padding: 15px; border-radius: 8px; text-align: center;"><div style="font-size: 2rem; font-weight: bold;">' + formatCurrency(totalSpent) + '</div><div>Σύνολο</div></div></div>' +
                '<h3 style="color:#2a5a5a; border-bottom: 2px solid #eee; padding-bottom: 10px;">Ιστορικό</h3>' +
                '<table border="1" style="width:100%; border-collapse:collapse; font-size:12px; margin-top: 15px;"><thead><tr style="background:#2a5a5a; color:white;">' +
                '<th style="padding:10px;">Ημ/νία</th><th style="padding:10px;">Περιγραφή</th><th style="padding:10px;">Τοποθεσία</th><th style="padding:10px;">Σύνολο</th><th style="padding:10px;">Υπόλοιπο</th></tr></thead><tbody>';

            customerOrders.forEach((order, index) => {
                const bgColor = index % 2 === 0 ? '#f9f9f9' : 'white';
                html += '<tr style="background: ' + bgColor + ';"><td style="padding:8px;">' + formatDate(order.delivery_date) + '</td>' +
                    '<td style="padding:8px;">' + order.description.substring(0, 60) + (order.description.length > 60 ? '...' : '') + '</td>' +
                    '<td style="padding:8px;">' + order.location_type + '</td>' +
                    '<td style="padding:8px;"><strong>' + formatCurrency(order.total_price) + '</strong></td>' +
                    '<td style="padding:8px;">' + formatCurrency(order.total_price - order.deposit) + '</td></tr>';
            });

            html += '</tbody><tfoot><tr style="background:#2a5a5a; color:white; font-weight:bold;">' +
                '<td colspan="3" style="padding:10px; text-align:right;">ΣΥΝΟΛΑ:</td>' +
                '<td style="padding:10px;">' + formatCurrency(totalSpent) + '</td>' +
                '<td style="padding:10px;">' + formatCurrency(totalRemaining) + '</td></tr></tfoot></table>';

            renderAndPrint(html);
            Auth.logActivity('print', 'customer', currentCustomer.id, { type: 'customer_report', orders_count: customerOrders.length });
        }

        window.onload = loadCustomerProfile;
    </script>
</body>
</html>
