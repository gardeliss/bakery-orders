<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ιστορικό - Ζαχαροπλαστείο Ζάχαρη</title>
    <link rel="stylesheet" href="modern-style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>
    <div class="top-header">
        <div class="header-content">
            <div style="width: 100px;"></div>
            <div class="logo-container">
                <a href="dashboard.html" class="logo-link">
                    <img src="banner.png" alt="Ζάχαρη" class="logo-nav">
                </a>
            </div>
            <div class="user-menu-top" id="userMenuTop"></div>
        </div>
    </div>

    <nav id="navbar" class="navbar"></nav>
    <div class="mobile-user-icon" id="mobileUserIcon">👤</div>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">📝 Ιστορικό Ενεργειών</h2>
                <button onclick="exportToCSV()" class="btn btn-primary">📥 Export CSV</button>
            </div>
            <div class="card-body">
                <!-- Filters -->
                <div class="form-row" style="margin-bottom: 15px;">
                    <div class="form-group">
                        <label class="form-label">Χρήστης</label>
                        <select id="userFilter" class="form-control" onchange="filterActivities()">
                            <option value="">Όλοι</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Ενέργεια</label>
                        <select id="actionFilter" class="form-control" onchange="filterActivities()">
                            <option value="">Όλες</option>
                            <option value="create">Δημιουργία</option>
                            <option value="update">Ενημέρωση</option>
                            <option value="delete">Διαγραφή</option>
                            <option value="login">Σύνδεση</option>
                            <option value="logout">Αποσύνδεση</option>
                            <option value="print">Εκτύπωση</option>
                            <option value="sync">Συγχρονισμός</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Τύπος</label>
                        <select id="entityFilter" class="form-control" onchange="filterActivities()">
                            <option value="">Όλα</option>
                            <option value="order">Παραγγελία</option>
                            <option value="customer">Πελάτης</option>
                            <option value="user">Χρήστης</option>
                        </select>
                    </div>
                </div>



                <div class="form-row" style="margin-bottom: 15px;">
                    <div class="form-group">
                        <label class="form-label">Από Ημερομηνία</label>
                        <div style="position: relative;">
                            <span style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #6c757d; z-index: 10;">📅</span>
                            <input type="text" id="dateFrom" class="form-control" placeholder="Επιλέξτε" style="padding-left: 40px;" readonly>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Έως Ημερομηνία</label>
                        <div style="position: relative;">
                            <span style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #6c757d; z-index: 10;">📅</span>
                            <input type="text" id="dateTo" class="form-control" placeholder="Επιλέξτε" style="padding-left: 40px;" readonly>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Εμφάνιση</label>
                        <select id="limitFilter" class="form-control" onchange="filterActivities()">
                            <option value="50">50 τελευταίες</option>
                            <option value="100">100 τελευταίες</option>
                            <option value="500">500 τελευταίες</option>
                            <option value="all">Όλες</option>
                        </select>
                    </div>
                </div>
                
                <!-- Clear Filters Button -->
                <div class="form-group">
                    <label class="form-label">&nbsp;</label>
                    <button onclick="clearAllFilters()" class="btn btn-outline" style="width: 100%;">🔄 Καθαρισμός</button>
                </div>

                <!-- Results Count -->
                <div style="margin-bottom: 12px; color: #6c757d; font-size: 0.9rem;">
                    <span id="resultsCount">0</span> ενέργειες
                </div>

                <!-- Activity List -->
                <div class="table-wrapper">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Ημ/νία</th>
                                <th>Χρήστης</th>
                                <th>Ενέργεια</th>
                                <th>Τύπος</th>
                                <th>Λεπτομέρειες</th>
                            </tr>
                        </thead>
                        <tbody id="activityTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav" id="bottomNav"></nav>
    <a href="order-form.html" class="fab">+</a>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/gr.js"></script>
    <script>
        Auth.requireAuth();
        Auth.requireAdmin();

        // Initialize Flatpickr for date filters
            flatpickr("#dateFrom", {
                locale: "gr",
                dateFormat: "Y-m-d",
                allowInput: true,
                onChange: function() {
                    filterActivities();
                }
            });
            
            flatpickr("#dateTo", {
                locale: "gr",
                dateFormat: "Y-m-d",
                allowInput: true,
                onChange: function() {
                    filterActivities();
                }
            });    

        let allActivities = [];
        let allUsers = [];

        async function fetchData() {
            showLoading();

            try {
                const { data: users, error: usersError } = await _supabase.from('users').select('id, full_name');
                if (usersError) throw usersError;
                allUsers = users || [];

                const userFilter = document.getElementById('userFilter');
                userFilter.innerHTML = '<option value="">Όλοι</option>' + 
                    allUsers.map(u => '<option value="' + u.id + '">' + u.full_name + '</option>').join('');

                const { data: activities, error: activitiesError } = await _supabase
                    .from('activity_log')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(500);

                if (activitiesError) throw activitiesError;
                allActivities = activities || [];

                filterActivities();

            } catch (err) {
                showToast('Σφάλμα φόρτωσης: ' + err.message, 'error');
            }

            hideLoading();
        }

        function filterActivities() {
            const userFilter = document.getElementById('userFilter').value;
            const actionFilter = document.getElementById('actionFilter').value;
            const entityFilter = document.getElementById('entityFilter').value;
            const dateFrom = document.getElementById('dateFrom').value;
            const dateTo = document.getElementById('dateTo').value;
            const limit = document.getElementById('limitFilter').value;

            let filtered = allActivities.filter(activity => {
                const matchesUser = !userFilter || activity.user_id === userFilter;
                const matchesAction = !actionFilter || activity.action === actionFilter;
                const matchesEntity = !entityFilter || activity.entity_type === entityFilter;

                const activityDate = activity.created_at.split('T')[0];
                const matchesDateFrom = !dateFrom || activityDate >= dateFrom;
                const matchesDateTo = !dateTo || activityDate <= dateTo;

                return matchesUser && matchesAction && matchesEntity && matchesDateFrom && matchesDateTo;
            });

            if (limit !== 'all') {
                filtered = filtered.slice(0, parseInt(limit));
            }

            displayActivities(filtered);
        }

        function displayActivities(activities) {
            const tbody = document.getElementById('activityTableBody');
            const count = document.getElementById('resultsCount');

            count.textContent = activities.length;

            if (activities.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color: #6c757d; padding: 30px;">Δεν βρέθηκαν ενέργειες</td></tr>';
                return;
            }

            tbody.innerHTML = activities.map(activity => {
                const user = allUsers.find(u => u.id === activity.user_id);
                const userName = user ? user.full_name : 'Άγνωστος';
                // Debug: log raw timestamp
                console.log('Raw timestamp:', activity.created_at);
                console.log('Browser time:', new Date(activity.created_at).toString());
                
                const greekTime = formatGreekDateTime(activity.created_at);
                console.log('Greek time result:', greekTime);
                
                const dateStr = greekTime.date;
                const timeStr = greekTime.time;

                const actionBadge = getActionBadge(activity.action);
                const entityText = getEntityText(activity.entity_type);
                const details = getActivityDetails(activity);

                return '<tr>' +
                    '<td>' + dateStr + '<br><small style="color: #6c757d;">' + timeStr + '</small></td>' +
                    '<td><strong>' + userName + '</strong></td>' +
                    '<td>' + actionBadge + '</td>' +
                    '<td>' + entityText + '</td>' +
                    '<td style="font-size: 0.85rem;">' + details + '</td>' +
                '</tr>';
            }).join('');
        }

        function getActionBadge(action) {
            const badges = {
                'create': '<span class="badge badge-success">Δημιουργία</span>',
                'update': '<span class="badge badge-info">Ενημέρωση</span>',
                'delete': '<span class="badge badge-danger">Διαγραφή</span>',
                'login': '<span class="badge" style="background: #6f42c1; color: white;">Σύνδεση</span>',
                'logout': '<span class="badge" style="background: #6c757d; color: white;">Αποσύνδεση</span>',
                'print': '<span class="badge badge-warning">Εκτύπωση</span>',
                'sync': '<span class="badge" style="background: #17a2b8; color: white;">Sync</span>'
            };
            return badges[action] || '<span class="badge">' + action + '</span>';
        }

        function getEntityText(entityType) {
            const entities = {
                'order': '📦 Παραγγελία',
                'customer': '👤 Πελάτης',
                'user': '🔑 Χρήστης',
                'backup': '💾 Backup'
            };
            return entities[entityType] || entityType;
        }

        function getActivityDetails(activity) {
            try {
                // Parse details if it's a string
                let details = activity.details;
                if (typeof details === 'string') {
                    try {
                        details = JSON.parse(details);
                    } catch (e) {
                        return details.substring(0, 50);
                    }
                }
                
                if (!details || Object.keys(details).length === 0) {
                    return '-';
                }
                
                // Handle different action types
                if (activity.action === 'print') {
                    const type = details.type || 'N/A';
                    const typeLabels = {
                        'single_order': 'Μονή Παραγγελία',
                        'today_orders': 'Σημερινές',
                        'weekly_list': 'Εβδομαδιαία Λίστα',
                        'weekly_table': 'Εβδομαδιαίος Πίνακας',
                        'monthly_table': 'Μηνιαίος Πίνακας',
                        'customer_report': 'Αναφορά Πελάτη'
                    };
                    let result = typeLabels[type] || type;
                    if (details.count) result += ' (' + details.count + ')';
                    if (details.date) result += ' - ' + formatDate(details.date);
                    return result;
                }
                
                if (activity.action === 'create' || activity.action === 'update') {
                    if (details.customer) {
                        return details.customer;
                    }
                    if (details.username) {
                        return 'Χρήστης: ' + details.username;
                    }
                    if (details.order && details.order.first_name) {
                        return details.order.last_name + ' ' + details.order.first_name;
                    }
                }
                
                if (activity.action === 'delete') {
                    if (details.customer) {
                        return 'Διαγράφηκε: ' + details.customer;
                    }
                    if (details.username) {
                        return 'Διαγράφηκε χρήστης: ' + details.username;
                    }
                }
                
                if (activity.action === 'sync') {
                    return 'Συγχρονίστηκαν ' + (details.count || 0) + ' εγγραφές';
                }
                
                if (activity.action === 'backup') {
                    let result = 'Backup: ';
                    if (details.orders) result += details.orders + ' παραγγελίες, ';
                    if (details.customers) result += details.customers + ' πελάτες';
                    return result;
                }
                
                if (activity.action === 'restore') {
                    if (details.type === 'database') {
                        return 'Επαναφορά από βάση';
                    }
                    return 'Επαναφορά';
                }
                
                if (activity.action === 'export') {
                    return 'Export ' + (details.count || 0) + ' εγγραφών';
                }
                
                // Default: show first meaningful value
                const keys = Object.keys(details);
                if (keys.length > 0) {
                    const firstKey = keys[0];
                    const value = details[firstKey];
                    if (typeof value === 'string') {
                        return value.substring(0, 50);
                    }
                    return firstKey + ': ' + value;
                }
                
                return '-';
                
            } catch (e) {
                return '-';
            }
        }

        function exportToCSV() {
            if (allActivities.length === 0) {
                showToast('Δεν υπάρχουν δεδομένα', 'warning');
                return;
            }

            const userFilter = document.getElementById('userFilter').value;
            const actionFilter = document.getElementById('actionFilter').value;
            const entityFilter = document.getElementById('entityFilter').value;

            let filtered = allActivities.filter(activity => {
                const matchesUser = !userFilter || activity.user_id === userFilter;
                const matchesAction = !actionFilter || activity.action === actionFilter;
                const matchesEntity = !entityFilter || activity.entity_type === entityFilter;
                return matchesUser && matchesAction && matchesEntity;
            });

            let csvContent = 'Ημερομηνία,Ώρα,Χρήστης,Ενέργεια,Τύπος,Λεπτομέρειες\n';

            filtered.forEach(activity => {
                const user = allUsers.find(u => u.id === activity.user_id);
                const userName = user ? user.full_name : 'Άγνωστος';
                const timestamp = new Date(activity.created_at);
                const dateStr = timestamp.toLocaleDateString('el-GR');
                const timeStr = timestamp.toLocaleTimeString('el-GR');
                const details = getActivityDetails(activity).replace(/,/g, ';');

                csvContent += dateStr + ',' + timeStr + ',' + userName + ',' + activity.action + ',' + 
                    activity.entity_type + ',' + details + '\n';
            });

            const filename = 'activity_log_' + new Date().toISOString().split('T')[0] + '.csv';
            exportToCSVWithBOM(csvContent, filename);
            
            Auth.logActivity('export', 'activity_log', null, { count: filtered.length });
            showToast('Το αρχείο κατέβηκε!', 'success');
        }

        function clearAllFilters() {
            document.getElementById('userFilter').value = '';
            document.getElementById('actionFilter').value = '';
            document.getElementById('entityFilter').value = '';
            document.getElementById('dateFrom').value = '';
            document.getElementById('dateTo').value = '';
            document.getElementById('limitFilter').value = '50';
            filterActivities();
        }

        window.onload = fetchData;
    </script>
</body>
</html>
