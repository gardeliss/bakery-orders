<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Σύνδεση - Ζαχαροπλαστείο Ζάχαρη</title>
    <link rel="stylesheet" href="v3-modern-style.css">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            padding: 20px;
        }

        .login-card {
            background: var(--bg-card);
            padding: 40px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 450px;
            animation: slideUp 0.5s ease;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-login {
            width: 200px;
            margin-bottom: 20px;
        }

        .login-title {
            color: var(--primary);
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .login-subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <img src="banner.png" alt="Ζάχαρη Logo" class="logo-login">
                <h1 class="login-title">Καλώς ήρθατε</h1>
                <p class="login-subtitle">Σύστημα Διαχείρισης Παραγγελιών</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label">👤 Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        class="form-control" 
                        placeholder="Εισάγετε το username σας"
                        required
                        autocomplete="username"
                    >
                </div>

                <div class="form-group">
                    <label class="form-label">🔒 Κωδικός</label>
                    <input 
                        type="password" 
                        id="password" 
                        class="form-control" 
                        placeholder="Εισάγετε τον κωδικό σας"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
                    🔑 Σύνδεση
                </button>
            </form>

            <div style="margin-top: 30px; padding-top: 20px; border-top: 2px solid #e0e0e0; text-align: center;">
                <p style="color: #6c757d; font-size: 0.85rem; margin-bottom: 10px;">
                    <strong>Demo Credentials:</strong>
                </p>
                <p style="color: #6c757d; font-size: 0.8rem; margin: 5px 0;">
                    👤 Admin: admin / admin123
                </p>
                <p style="color: #6c757d; font-size: 0.8rem; margin: 5px 0;">
                    👤 User: user / user123
                </p>
            </div>
        </div>
    </div>

    <div id="printArea"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="v3-app.js"></script>
    <script>
        if (Auth.isAuthenticated()) {
            window.location.href = 'dashboard.html';
        }

        async function handleLogin(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');

            btn.disabled = true;
            btn.innerHTML = '<div class="spinner spinner-sm"></div> Σύνδεση...';

            await Auth.login(username, password);

            btn.disabled = false;
            btn.innerHTML = '🔑 Σύνδεση';
        }
    </script>
</body>
</html>
