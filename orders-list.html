<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Παραγγελίες - Ζαχαροπλαστείο Ζάχαρη</title>
    <link rel="stylesheet" href="modern-style.css">
</head>
<body>
    <div class="top-header">
        <div class="header-content">
            <div style="width: 100px;"></div>
            <div class="logo-container">
                <a href="dashboard.html" class="logo-link">
                    <img src="banner.png" alt="Ζάχαρη" class="logo-nav">
                </a>
            </div>
            <div class="user-menu-top" id="userMenuTop"></div>
        </div>
    </div>

    <nav id="navbar" class="navbar"></nav>
    <div class="mobile-user-icon" id="mobileUserIcon">👤</div>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">📋 Παραγγελίες</h2>
                <a href="order-form.html" class="btn btn-primary">➕ Νέα</a>
            </div>
            <div class="card-body">
                <!-- Search -->
                <div style="position: relative; margin-bottom: 15px;">
                    <input 
                        type="text" 
                        id="searchInput" 
                        class="form-control" 
                        style="padding-left: 40px; padding-right: 35px;"
                        placeholder="🔍 Αναζήτηση..."
                        onkeyup="filterOrders(); toggleClearBtn('searchInput', 'clearSearchBtn')"
                    >
                    <span id="clearSearchBtn" class="clear-input-btn" style="display:none;" onclick="clearSearch()">×</span>
                </div>

                <!-- Filters -->
                <div class="form-row" style="margin-bottom: 15px;">
                    <div class="form-group">
                        <label class="form-label">Κατάσταση</label>
                        <select id="statusFilter" class="form-control" onchange="filterOrders()">
                            <option value="active">Ενεργές (Εκκρεμεί & Επιβεβαιωμένη)</option>
                            <option value="">Όλες</option>
                            <option value="pending">Εκκρεμεί</option>
                            <option value="confirmed">Επιβεβαιωμένη</option>
                            <option value="completed">Ολοκληρωμένη</option>
                            <option value="cancelled">Ακυρωμένη</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Ταξινόμηση</label>
                        <select id="sortOrder" class="form-control" onchange="filterOrders()">
                            <option value="date_asc">Ημερομηνία ↑</option>
                            <option value="date_desc">Ημερομηνία ↓</option>
                            <option value="name_asc">Όνομα Α-Ω</option>
                            <option value="price_desc">Τιμή ↓</option>
                        </select>
                    </div>
                </div>

                <div class="form-row" style="margin-bottom: 15px;">
                    <div class="form-group">
                        <label class="form-label">Από</label>
                        <input type="date" id="dateFrom" class="form-control" onchange="filterOrders()">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Έως</label>
                        <input type="date" id="dateTo" class="form-control" onchange="filterOrders()">
                    </div>
                </div>

                <!-- Clear Filters Button -->
                <div style="margin-top: 15px;">
                    <button onclick="clearAllFilters()" class="btn btn-outline" style="width: 100%;">🔄 Καθαρισμός Φίλτρων</button>
                </div>

                <!-- Results Count -->
                <div style="margin-bottom: 12px; color: #6c757d; font-size: 0.9rem;">
                    <span id="resultsCount">0</span> παραγγελίες
                </div>

                <!-- Orders List -->
                <div id="ordersList"></div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav" id="bottomNav"></nav>
    <a href="order-form.html" class="fab">+</a>

    <div id="printArea"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
    <script>
        Auth.requireAuth();

        let allOrders = [];

        async function fetchOrders() {
            showLoading();

            try {
                const { data, error } = await _supabase
                    .from('orders')
                    .select('*')
                    .order('delivery_date', { ascending: true });

                if (error) throw error;

                allOrders = data || [];
                filterOrders();

            } catch (err) {
                showToast('Σφάλμα φόρτωσης: ' + err.message, 'error');
            }

            hideLoading();
        }

        function filterOrders() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;
            const sortOrder = document.getElementById('sortOrder').value;
            const dateFrom = document.getElementById('dateFrom').value;
            const dateTo = document.getElementById('dateTo').value;

            let filtered = allOrders.filter(order => {
                const matchesSearch = 
                    order.first_name.toLowerCase().includes(searchTerm) ||
                    order.last_name.toLowerCase().includes(searchTerm) ||
                    order.phone.includes(searchTerm) ||
                    order.description.toLowerCase().includes(searchTerm);

                let matchesStatus = true;
                if (statusFilter === 'active') {
                    matchesStatus = order.status === 'pending' || order.status === 'confirmed';
                } else if (statusFilter) {
                    matchesStatus = order.status === statusFilter;
                }

                const matchesDateFrom = !dateFrom || order.delivery_date >= dateFrom;
                const matchesDateTo = !dateTo || order.delivery_date <= dateTo;

                return matchesSearch && matchesStatus && matchesDateFrom && matchesDateTo;
            });

            filtered.sort((a, b) => {
                switch (sortOrder) {
                    case 'date_asc': return new Date(a.delivery_date) - new Date(b.delivery_date);
                    case 'date_desc': return new Date(b.delivery_date) - new Date(a.delivery_date);
                    case 'name_asc': return (a.last_name + a.first_name).localeCompare(b.last_name + b.first_name);
                    case 'price_desc': return b.total_price - a.total_price;
                    default: return 0;
                }
            });

            displayOrders(filtered);
        }

        function displayOrders(orders) {
            const list = document.getElementById('ordersList');
            const count = document.getElementById('resultsCount');

            count.textContent = orders.length;

            if (orders.length === 0) {
                list.innerHTML = '<p style="text-align:center; color: #6c757d; padding: 30px;">Δεν βρέθηκαν παραγγελίες</p>';
                return;
            }

            list.innerHTML = '';

            orders.forEach(order => {
                const orderCard = document.createElement('div');
                orderCard.className = 'order-card';
                orderCard.innerHTML = 
                    '<div class="order-header">' +
                        '<div>' +
                            '<div class="order-customer">' + order.last_name + ' ' + order.first_name + '</div>' +
                            '<div class="order-date">📅 ' + formatDate(order.delivery_date) + ' (' + getGreekDayName(order.delivery_date) + ') | 📞 ' + order.phone + ' | 📍 ' + order.location_type + '</div>' +
                        '</div>' +
                        '<span class="badge badge-' + order.status + '">' + getStatusText(order.status) + '</span>' +
                    '</div>' +
                    '<div class="order-description">' + (order.description.length > 120 ? order.description.substring(0, 120) + '...' : order.description) + '</div>' +
                    '<div class="order-footer">' +
                        '<div>' +
                            '<div class="order-price">' + formatCurrency(order.total_price) + '</div>' +
                            '<small style="color: #6c757d;">Υπόλοιπο: ' + formatCurrency(order.total_price - order.deposit) + '</small>' +
                        '</div>' +
                        '<div class="order-actions"></div>' +
                    '</div>';

                const editBtn = document.createElement('a');
                editBtn.href = 'order-form.html?edit=' + order.id;
                editBtn.className = 'btn btn-sm btn-secondary';
                editBtn.title = 'Επεξεργασία';
                editBtn.textContent = '📝';

                const printBtn = document.createElement('button');
                printBtn.className = 'btn btn-sm btn-outline';
                printBtn.title = 'Εκτύπωση';
                printBtn.textContent = '🖨️';
                printBtn.addEventListener('click', () => printOrder(order.id));

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'btn btn-sm btn-danger';
                deleteBtn.title = 'Διαγραφή';
                deleteBtn.textContent = '🗑️';
                deleteBtn.addEventListener('click', () => deleteOrder(order.id));

                const actionsDiv = orderCard.querySelector('.order-actions');
                actionsDiv.appendChild(editBtn);
                actionsDiv.appendChild(printBtn);
                actionsDiv.appendChild(deleteBtn);

                list.appendChild(orderCard);
            });
        }

        function getStatusText(status) {
            const statuses = {
                'pending': 'Εκκρεμεί',
                'confirmed': 'Επιβεβαιωμένη',
                'completed': 'Ολοκληρωμένη',
                'cancelled': 'Ακυρωμένη'
            };
            return statuses[status] || status;
        }

        async function deleteOrder(orderId) {
            const order = allOrders.find(o => o.id === orderId);
            if (!order) return;

            confirmDialog(
                'Διαγραφή παραγγελίας: ' + order.last_name + ' ' + order.first_name + ';',
                async () => {
                    showLoading();

                    try {
                        const { error } = await _supabase.from('orders').delete().eq('id', orderId);
                        if (error) throw error;

                        await Auth.logActivity('delete', 'order', orderId, { 
                            customer: order.last_name + ' ' + order.first_name,
                            delivery_date: order.delivery_date
                        });

                        showToast('Η παραγγελία διαγράφηκε', 'success');
                        fetchOrders();

                    } catch (err) {
                        showToast('Σφάλμα: ' + err.message, 'error');
                    }

                    hideLoading();
                }
            );
        }

        function printOrder(orderId) {
            const order = allOrders.find(o => o.id === orderId);
            if (!order) return;

            let html = '<h2 style="text-align:center; border-bottom:2px solid #2a5a5a; padding-bottom: 10px;">ΑΠΟΔΕΙΞΗ ΠΑΡΑΓΓΕΛΙΑΣ</h2>' +
                '<p><strong>Πελάτης:</strong> ' + order.last_name + ' ' + order.first_name + '</p>' +
                '<p><strong>Τηλέφωνο:</strong> ' + order.phone + '</p>' +
                (order.email ? '<p><strong>Email:</strong> ' + order.email + '</p>' : '') +
                '<p><strong>Ημερομηνία:</strong> ' + formatDate(order.delivery_date) + ' (' + getGreekDayName(order.delivery_date) + ')</p>' +
                '<p><strong>Τοποθεσία:</strong> ' + order.location_type + '</p>' +
                (order.address ? '<p><strong>Διεύθυνση:</strong> ' + order.address + '</p>' : '') +
                '<div style="border:1px solid #ccc; padding:15px; margin:20px 0; background: #f9f9f9;">' +
                '<strong>ΠΕΡΙΓΡΑΦΗ:</strong><br><br>' + order.description.replace(/\n/g, '<br>') + '</div>';

            if (order.images && order.images.length > 0) {
                html += '<div style="margin:20px 0;"><strong>Φωτογραφίες:</strong><br>' +
                    '<div style="display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:10px;">';
                order.images.forEach(img => {
                    html += '<img src="' + img + '" style="width:100%; border:1px solid #ddd; border-radius:4px;">';
                });
                html += '</div></div>';
            }

            html += '<div style="text-align:right; margin-top: 30px;">' +
                '<p style="font-size: 1.1rem;"><strong>Σύνολο:</strong> ' + formatCurrency(order.total_price) + '</p>' +
                '<p style="font-size: 1.1rem;"><strong>Προκαταβολή:</strong> ' + formatCurrency(order.deposit) + '</p>' +
                '<h2 style="color:#2a5a5a; border-top: 2px solid #2a5a5a; padding-top: 10px;">Υπόλοιπο: ' + formatCurrency(order.total_price - order.deposit) + '</h2></div>' +
                '<div style="margin-top: 50px; text-align: center; font-size: 0.9rem; color: #666;">' +
                '<p>Σας ευχαριστούμε!</p><p>Ζαχαροπλαστείο ΖΑΧΑΡΗ - Από το 2012</p></div>';

            renderAndPrint(html);
            Auth.logActivity('print', 'order', orderId, { type: 'single_order' });
        }

        window.onload = fetchOrders;
    </script>
</body>
</html>
